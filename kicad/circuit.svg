<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <!-- Ground symbol, its top at (0,0) -->
    <g id="gnd">
      <path d="M0,0 V8 M-10,8 H10 M-6,13 H6 M-2,18 H2" fill="none" stroke="#222" stroke-width="2"/>
    </g>
    <!-- One SSR output.  Origin at the module pin. -->
    <g id="output">
      <path d="M0,0 H400" class="wire sig"/>
      <circle cx="200" cy="0" r="3.5" class="dot"/>
      <path d="M200,0 V10" class="wire sig"/>
      <rect x="192" y="10" width="16" height="28" class="part"/>
      <path d="M200,38 V44" class="wire gnd"/>
      <use href="#gnd" x="200" y="44"/>
      <path d="M400,30 H370 V38" class="wire gnd"/>
      <use href="#gnd" x="370" y="38"/>
      <rect x="400" y="-15" width="90" height="60" class="part"/>
      <text x="408" y="5" class="pin">SIG</text>
      <text x="408" y="35" class="pin">GND</text>
      <path d="M490,0 H540 M490,30 H540" class="wire ext"/>
      <rect x="540" y="-15" width="120" height="60" rx="6" class="box"/>
      <text x="600" y="5" text-anchor="middle" class="lbl">SSR</text>
      <text x="548" y="5" class="pin">+</text>
      <text x="548" y="35" class="pin">−</text>
      <text x="600" y="35" text-anchor="middle" class="val">DC in, 3-32V</text>
    </g>
  </defs>
  <style>
    .box { fill: #f6f6f6; stroke: #222; stroke-width: 2; }
    .wire { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
    .poe { stroke: #7f8c8d; }
    .ext { stroke: #7f8c8d; stroke-dasharray: 6 4; }
    .v5 { stroke: #8e44ad; }
    .v33 { stroke: #e67e22; }
    .gnd { stroke: #222; }
    .sig { stroke: #2471a3; }
    .i2c { stroke: #1e8449; }
    .part { fill: #fff; stroke: #222; stroke-width: 2; }
    .sym { fill: none; stroke: #222; stroke-width: 2; }
    .lbl { fill: #222; }
    .ref { fill: #222; font-weight: bold; }
    .val { fill: #555; font-size: 13px; }
    .pin { fill: #222; font-size: 13px; }
    .title { fill: #222; font-size: 20px; font-weight: bold; }
    .note { fill: #555; font-size: 12px; font-style: italic; }
    .dot { fill: #222; }
    .flag5 { fill: #8e44ad; font-size: 13px; font-weight: bold; }
    .flag33 { fill: #e67e22; font-size: 13px; font-weight: bold; }
  </style>

  <rect x="0" y="0" width="1200" height="790" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" class="title">RHB water heater carrier circuit</text>

  <!-- PoE switch -->
  <rect x="30" y="70" width="180" height="60" rx="6" class="box"/>
  <text x="120" y="96" text-anchor="middle" class="lbl">PoE switch</text>
  <text x="120" y="114" text-anchor="middle" class="val">802.3af PSE, 44-57V</text>
  <path d="M210,100 H300" class="wire poe"/>
  <text x="216" y="92" class="val">Cat5</text>

  <text x="30" y="170" class="note">PoE is the only supply.</text>
  <text x="30" y="198" class="note">Do not plug in USB-C while PoE is</text>
  <text x="30" y="214" class="note">connected: the PoE module is not</text>
  <text x="30" y="230" class="note">isolated from the board.</text>
  <text x="30" y="258" class="note">Dashed: off-board wiring. The SSRs</text>
  <text x="30" y="274" class="note">switch the valve, heater and safety</text>
  <text x="30" y="290" class="note">loads from their own supplies.</text>

  <!-- ESP32-S3-ETH -->
  <rect x="300" y="60" width="220" height="690" rx="6" class="box"/>
  <text x="410" y="84" text-anchor="middle" class="ref">U1</text>
  <text x="410" y="102" text-anchor="middle" class="lbl">Waveshare ESP32-S3-ETH</text>
  <rect x="318" y="114" width="184" height="52" rx="4" class="part"/>
  <text x="410" y="136" text-anchor="middle" class="lbl">PoE module (802.3af)</text>
  <text x="410" y="154" text-anchor="middle" class="val">RJ45 → 5V on VSYS</text>
  <text x="410" y="460" text-anchor="middle" class="note">on 2 x 20 female headers;</text>
  <text x="410" y="476" text-anchor="middle" class="note">RJ45 end overhangs the board</text>

  <text x="512" y="205" text-anchor="end" class="pin">VSYS 5V (39)</text>
  <text x="512" y="235" text-anchor="end" class="pin">3V3 (36)</text>
  <text x="512" y="265" text-anchor="end" class="pin">GND</text>
  <text x="512" y="325" text-anchor="end" class="pin">IO48 (4)</text>
  <text x="512" y="415" text-anchor="end" class="pin">IO47 (5)</text>
  <text x="512" y="495" text-anchor="end" class="pin">IO3 (27)</text>
  <text x="512" y="605" text-anchor="end" class="pin">IO1 (25)</text>
  <text x="512" y="675" text-anchor="end" class="pin">IO15 (29)</text>
  <text x="512" y="715" text-anchor="end" class="pin">IO39 SDA (12)</text>
  <text x="512" y="735" text-anchor="end" class="pin">IO38 SCL (14)</text>

  <!-- Supplies out of the module -->
  <path d="M520,200 H560" class="wire v5"/>
  <text x="566" y="205" class="flag5">5V</text>
  <path d="M520,230 H560" class="wire v33"/>
  <text x="566" y="235" class="flag33">3V3</text>
  <path d="M520,260 H545 V270" class="wire gnd"/>
  <use href="#gnd" x="545" y="270"/>

  <!-- SSR outputs -->
  <use href="#output" x="520" y="320"/>
  <text x="732" y="346" class="ref">R1</text>
  <text x="732" y="360" class="val">10k</text>
  <text x="965" y="299" text-anchor="middle" class="ref">J3</text>
  <text x="1120" y="299" text-anchor="middle" class="lbl">valve</text>
  <use href="#output" x="520" y="410"/>
  <text x="732" y="436" class="ref">R2</text>
  <text x="732" y="450" class="val">10k</text>
  <text x="965" y="389" text-anchor="middle" class="ref">J4</text>
  <text x="1120" y="389" text-anchor="middle" class="lbl">heater</text>
  <use href="#output" x="520" y="490"/>
  <text x="732" y="516" class="ref">R3</text>
  <text x="732" y="530" class="val">10k</text>
  <text x="965" y="469" text-anchor="middle" class="ref">J5</text>
  <text x="1120" y="469" text-anchor="middle" class="lbl">safety</text>

  <g transform="translate(0,30)">
  <!-- Pressure: 0.5-4.5V in, x 2/3 to IO1 -->
  <path d="M520,570 H860" class="wire sig"/>
  <circle cx="620" cy="570" r="3.5" class="dot"/>
  <circle cx="690" cy="570" r="3.5" class="dot"/>
  <path d="M620,570 V588 M608,588 H632 M608,596 H632 M620,596 V612" class="sym"/>
  <use href="#gnd" x="620" y="612"/>
  <text x="572" y="602" class="ref">C1</text>
  <text x="562" y="618" class="val">100nF</text>
  <rect x="682" y="578" width="16" height="32" class="part"/>
  <path d="M690,570 V578 M690,610 V614" class="wire gnd"/>
  <use href="#gnd" x="690" y="614"/>
  <text x="704" y="594" class="ref">R5</text>
  <text x="704" y="610" class="val">20k</text>
  <rect x="750" y="562" width="60" height="16" class="part"/>
  <text x="780" y="556" text-anchor="middle" class="ref">R4 <tspan class="val">10k</tspan></text>
  <rect x="860" y="535" width="110" height="80" class="part"/>
  <text x="915" y="529" text-anchor="middle" class="ref">J6</text>
  <text x="868" y="550" class="pin">+5V</text>
  <text x="868" y="575" class="pin">SIG</text>
  <text x="868" y="600" class="pin">GND</text>
  <path d="M860,545 H845 V528" class="wire v5"/>
  <text x="845" y="523" text-anchor="middle" class="flag5">5V</text>
  <path d="M860,595 H840 V603" class="wire gnd"/>
  <use href="#gnd" x="840" y="603"/>
  <text x="980" y="566" class="lbl">0.5-4.5V pressure</text>
  <text x="980" y="582" class="lbl">transducer</text>
  <text x="980" y="600" class="note">→ 0.33-3.0V at IO1</text>

  <!-- DS18B20 -->
  <path d="M520,640 H860" class="wire sig"/>
  <circle cx="780" cy="640" r="3.5" class="dot"/>
  <rect x="772" y="600" width="16" height="32" class="part"/>
  <path d="M780,632 V640 M780,600 V594" class="wire v33"/>
  <text x="768" y="598" class="flag33" text-anchor="end">3V3</text>
  <text x="794" y="616" class="ref">R6</text>
  <text x="794" y="632" class="val">4.7k</text>
  <rect x="860" y="622" width="110" height="64" class="part"/>
  <text x="868" y="638" class="pin">3V3</text>
  <text x="868" y="658" class="pin">DQ</text>
  <text x="868" y="678" class="pin">GND</text>
  <text x="980" y="658" class="ref">J7 <tspan class="lbl" font-weight="normal">DS18B20 bath probe</tspan></text>

  <!-- Display -->
  <path d="M520,680 H560 V700 H1000" class="wire i2c"/>
  <path d="M520,700 H540 V720 H1000" class="wire i2c"/>
  <rect x="1000" y="684" width="160" height="56" class="part"/>
  <text x="1008" y="698" class="pin">+ 3V3     − GND</text>
  <text x="1008" y="716" class="pin">D  SDA</text>
  <text x="1008" y="734" class="pin">C  SCL</text>
  <text x="1080" y="678" text-anchor="middle" class="ref">J2  HT16K33 display</text>
  </g>
</svg>
